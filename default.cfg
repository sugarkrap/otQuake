// default.cfg -- key bindings and performance defaults for otQuake on the
// Zaurus.
//
// The bindings normally ship inside id1/pak0.pak, but the pak on this
// device does not contain one, so Quake started with no bindings at all:
// menus worked (they read key events directly) while nothing in-game
// responded, because every in-game action goes through a binding.
//
// quake.rc execs default.cfg first and config.cfg after it, so anything the
// player changes in the menu -- or anything set explicitly in config.cfg --
// still wins. Every cvar below is a default, not a lock.

// On by default while the framebuffer and X11 backends are being compared.
show_fps "1"

// Hard fog: world geometry and entities farther than this many units from
// the camera are culled instead of drawn, and the resulting gap is filled
// with r_clearcolor -- the old N64/PC trick of hiding a short draw distance
// behind a flat colour instead of a hard pop. Cuts overdraw substantially
// on the SL-C860's PXA250. Put "r_farclip 0" in config.cfg to disable it
// (unlimited draw distance), or change the distance to taste.
r_farclip "2048"

// Water and sky surfaces regenerate a warped/animated tile every time they
// are drawn, which costs more per pixel than a flat wall. r_farclip_fx
// gives just those surfaces a shorter cull distance than r_farclip, so the
// expensive ones drop out first. Must be <= r_farclip to matter; "0"
// disables it (they'll still vanish at the normal r_farclip distance).
r_farclip_fx "1024"

// Dynamic resolution scaling: steps "viewsize" down when the measured
// frame rate drops below r_dynamicscale_target, and back up once there is
// headroom again. "=" and "-" (sizeup/sizedown below) still work, but
// r_dynamicscale will override the size again at its next check. Set
// r_dynamicscale "0" in config.cfg for purely manual sizeup/sizedown.
r_dynamicscale "1"
r_dynamicscale_target "25"

// Lower than the engine's own default (2048) -- this hardware feels
// particle-heavy fights (rocket splash, lots of gibs) well before it feels
// most other content. Raise it back in config.cfg if there's headroom.
r_maxparticles "512"

unbindall

// Movement. Arrows are the stock Quake layout; WASD is added alongside
// because the SL-C860 has a real keyboard and it is far more comfortable.
bind "UPARROW"     "+forward"
bind "DOWNARROW"   "+back"
bind "LEFTARROW"   "+left"
bind "RIGHTARROW"  "+right"
bind "w"           "+forward"
bind "s"           "+back"
bind "a"           "+moveleft"
bind "d"           "+moveright"
bind "," "+moveleft"
bind "." "+moveright"

// Action. CTRL is fire, the stock binding.
bind "CTRL"        "+attack"
bind "SPACE"       "+jump"
bind "ENTER"       "+jump"
bind "SHIFT"       "+speed"
bind "ALT"         "+strafe"
bind "c"           "+movedown"
bind "v"           "+moveup"

// Weapons.
bind "1" "impulse 1"
bind "2" "impulse 2"
bind "3" "impulse 3"
bind "4" "impulse 4"
bind "5" "impulse 5"
bind "6" "impulse 6"
bind "7" "impulse 7"
bind "8" "impulse 8"
bind "0" "impulse 0"
bind "/" "impulse 10"
bind "]" "impulse 10"
bind "[" "impulse 12"

// Interface.
bind "ESCAPE" "togglemenu"
bind "`"      "toggleconsole"
bind "TAB"    "+showscores"
bind "F1"     "help"
bind "F2"     "menu_save"
bind "F3"     "menu_load"
bind "F10"    "quit"
bind "PAUSE"  "pause"
bind "="      "sizeup"
bind "-"      "sizedown"

// Pointer: deliberately unbound. The only pointer this device has is the
// touchscreen, and every look gesture is a press-drag-release -- so binding
// the tap to anything means you cannot aim without also doing it. Looking is
// handled by the motion events themselves (IN_Move), not by a binding, so
// leaving these unbound gives touch-to-look and nothing else. Fire is CTRL.
