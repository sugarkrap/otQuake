// default.cfg -- key bindings for otQuake on the Zaurus.
//
// This normally ships inside id1/pak0.pak, but the pak on this device does
// not contain one, so Quake started with no bindings at all: menus worked
// (they read key events directly) while nothing in-game responded, because
// every in-game action goes through a binding.
//
// quake.rc execs default.cfg first and config.cfg after it, so anything the
// player changes in the menu still wins -- this only supplies the defaults.

// On by default while the framebuffer and X11 backends are being compared.
show_fps "1"

unbindall

// Movement. Arrows are the stock Quake layout; WASD is added alongside
// because the SL-C860 has a real keyboard and it is far more comfortable.
bind "UPARROW"     "+forward"
bind "DOWNARROW"   "+back"
bind "LEFTARROW"   "+left"
bind "RIGHTARROW"  "+right"
bind "w"           "+forward"
bind "s"           "+back"
bind "a"           "+moveleft"
bind "d"           "+moveright"
bind "," "+moveleft"
bind "." "+moveright"

// Action. CTRL is fire, the stock binding.
bind "CTRL"        "+attack"
bind "SPACE"       "+jump"
bind "ENTER"       "+jump"
bind "SHIFT"       "+speed"
bind "ALT"         "+strafe"
bind "c"           "+movedown"
bind "v"           "+moveup"

// Weapons.
bind "1" "impulse 1"
bind "2" "impulse 2"
bind "3" "impulse 3"
bind "4" "impulse 4"
bind "5" "impulse 5"
bind "6" "impulse 6"
bind "7" "impulse 7"
bind "8" "impulse 8"
bind "0" "impulse 0"
bind "/" "impulse 10"
bind "]" "impulse 10"
bind "[" "impulse 12"

// Interface.
bind "ESCAPE" "togglemenu"
bind "`"      "toggleconsole"
bind "TAB"    "+showscores"
bind "F1"     "help"
bind "F2"     "menu_save"
bind "F3"     "menu_load"
bind "F10"    "quit"
bind "PAUSE"  "pause"
bind "="      "sizeup"
bind "-"      "sizedown"

// Pointer: deliberately unbound. The only pointer this device has is the
// touchscreen, and every look gesture is a press-drag-release -- so binding
// the tap to anything means you cannot aim without also doing it. Looking is
// handled by the motion events themselves (IN_Move), not by a binding, so
// leaving these unbound gives touch-to-look and nothing else. Fire is CTRL.
